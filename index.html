<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#0E8FA0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>HealthAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* ── LIGHT THEME — Health: Teal/Aqua palette ── */
    :root{
      --bg:#F0F7FA;
      --surface:#FFFFFF;
      --surface2:#E8F4F8;
      --surface3:#D8EEF6;
      --border:#C8E2EE;
      --border2:#A8CCE0;

      /* Core teal/aqua health palette — distinct from finance green */
      --teal-900:#0D4A5C;
      --teal-800:#0F5E74;
      --teal-700:#1272E2;
      --teal-600:#0E8FA0;
      --teal-500:#10A8BC;
      --teal-400:#2CBECE;
      --teal-300:#5ED2DF;
      --teal-200:#9DE4EC;
      --teal-100:#C8F0F5;
      --teal-50:#EAF8FB;

      /* Alias to --green-* names so existing code works */
      --green-900:#0D4A5C;
      --green-700:#0E8FA0;
      --green-600:#0E8FA0;
      --green-500:#10A8BC;
      --green-400:#2CBECE;
      --green-200:#9DE4EC;
      --green-100:#C8F0F5;
      --green-50:#EAF8FB;

      --primary:var(--teal-500);
      --primary2:var(--teal-700);
      --primary-bg:rgba(16,168,188,.09);

      --text:#082A35;
      --text2:#2A5F6E;
      --muted:#5A8D9A;
      --muted2:#8ABEC9;

      --red:#D94F3D;
      --red-bg:rgba(217,79,61,.09);
      --orange:#E07A2A;
      --orange-bg:rgba(224,122,42,.09);
      --blue:#3A7FBF;
      --blue-bg:rgba(58,127,191,.10);
      --purple:#7B5EA7;
      --purple-bg:rgba(123,94,167,.10);

      --shadow:0 1px 8px rgba(8,42,53,.07);
      --shadow-md:0 4px 20px rgba(8,42,53,.12);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --radius:16px;
      --radius-sm:12px;
    }

    /* ── DARK THEME ── */
    .dark{
      --bg:#071820;
      --surface:#0D2430;
      --surface2:#122E3C;
      --surface3:#183A4A;
      --border:#1E4455;
      --border2:#2A5A6E;
      --teal-900:#A8E8F0;
      --teal-700:#5CD4E0;
      --teal-600:#40C8D6;
      --teal-500:#2ABECE;
      --teal-400:#18AABC;
      --teal-300:#0E8FA0;
      --teal-200:#0A6070;
      --teal-100:#08384A;
      --teal-50:#0D2430;
      --green-900:#A8E8F0;
      --green-700:#40C8D6;
      --green-600:#2ABECE;
      --green-500:#2ABECE;
      --green-400:#18AABC;
      --green-200:#0E8FA0;
      --green-100:#08384A;
      --green-50:#0D2430;
      --primary:#2ABECE;
      --primary2:#18AABC;
      --primary-bg:rgba(42,190,206,.12);
      --text:#D8F2F7;
      --text2:#7ABFCA;
      --muted:#4A8A98;
      --muted2:#2A5A6E;
      --red:#E07070;
      --red-bg:rgba(224,112,112,.11);
      --orange:#D4895A;
      --orange-bg:rgba(212,137,90,.12);
      --blue:#5BA3E0;
      --blue-bg:rgba(91,163,224,.12);
      --purple:#A888D0;
      --purple-bg:rgba(168,136,208,.12);
      --shadow:0 1px 8px rgba(0,0,0,.28);
      --shadow-md:0 4px 20px rgba(0,0,0,.45);
    }

    /* body bg neutral so no teal bleeds above/below the app */
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s;touch-action:manipulation}
    body.dark{background:var(--bg)}
    #app{display:flex;flex-direction:column;height:100dvh;max-width:500px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}

    /* ── HEADER — no safe-area padding (causes fake notch in browser) ── */
    .header{
      background:var(--green-700);
      padding:14px 18px 0;
      flex-shrink:0;
      position:relative;
      z-index:10;
    }
    .header-top{display:flex;align-items:center;gap:10px;padding-bottom:12px}
    .logo{width:34px;height:34px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .logo-title{font-weight:800;font-size:15px;color:#fff;letter-spacing:-.3px}
    .logo-sub{font-size:10px;color:rgba(255,255,255,.6);margin-top:1px}

    /* ── TOP TAB NAV (slim horizontal pill strip) ── */
    .top-nav{
      display:flex;
      gap:4px;
      padding:0 0 9px;
      overflow-x:auto;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }
    .top-nav::-webkit-scrollbar{display:none}
    .tnav-item{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:row;
      align-items:center;
      justify-content:center;
      gap:5px;
      padding:5px 8px;
      border-radius:7px;
      cursor:pointer;
      color:rgba(255,255,255,.5);
      background:none;
      border:none;
      font-family:inherit;
      font-size:10px;
      font-weight:700;
      letter-spacing:.1px;
      text-transform:uppercase;
      transition:color .15s, background .15s;
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }
    .tnav-item svg{flex-shrink:0;opacity:.85}
    .tnav-item.active{color:#fff;background:rgba(255,255,255,.15)}
    .tnav-item.active svg{opacity:1}
    .tnav-item:active{background:rgba(255,255,255,.1)}
    /* Settings button highlight when ajustes active */
    #settings-btn.active-settings{background:rgba(255,255,255,.25)!important;border-color:rgba(255,255,255,.4)!important}

    /* ── TAB SWIPE CONTAINER ── */
    .tabs-viewport{flex:1;overflow:hidden;position:relative}
    .tabs-track{display:flex;height:100%;transition:transform .28s cubic-bezier(.25,.46,.45,.94);will-change:transform}
    /* Block layout so children stack normally and overflow-y:auto works */
    .tab-panel{min-width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(var(--safe-bottom)+32px);display:block;background:var(--bg)}
    /* Inner spacing between cards — more breathing room */
    .tab-panel > *{margin-bottom:14px}
    .tab-panel > *:last-child{margin-bottom:0}
    .tab-panel::-webkit-scrollbar{width:3px}
    .tab-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
    /* Swipe indicator dots */
    .swipe-dots{position:absolute;bottom:calc(var(--safe-bottom)+10px);left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:50;pointer-events:none}
    .swipe-dot{width:5px;height:5px;border-radius:50%;background:var(--border2);transition:all .2s}
    .swipe-dot.active{width:16px;border-radius:3px;background:var(--green-500)}

    /* ── CARDS ── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
    .card-title{font-weight:700;font-size:13px;margin-bottom:14px;color:var(--green-700);letter-spacing:.1px;display:flex;align-items:center;gap:8px}
    .card-accent{border-color:var(--green-200);background:var(--green-50)}

    /* ── HERO CARD ── */
    .hero-card{background:linear-gradient(155deg,var(--teal-600,#0E8FA0),var(--teal-900,#0D4A5C));border-radius:var(--radius);padding:22px 20px;box-shadow:0 4px 24px rgba(13,74,92,.28);color:#fff}
    .hero-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.75;margin-bottom:8px;font-weight:700}
    .hero-value{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:700;line-height:1}
    .hero-sub{font-size:12px;opacity:.7;margin-top:6px}

    /* ── STAT GRID ── */
    .stats-row{display:flex;gap:10px}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--teal-300,#5ED2DF);border-radius:var(--radius-sm);padding:14px 15px;flex:1;box-shadow:var(--shadow)}
    .stat-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
    .stat-value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;line-height:1;color:var(--text)}
    .stat-unit{font-size:10px;color:var(--muted);margin-top:4px;font-weight:600}

    /* ── PROGRESS ── */
    .prog-track{background:var(--green-100);border-radius:6px;height:7px;overflow:hidden;margin-top:8px}
    .prog-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1)}

    /* ── FAB ── */
    .fab{position:fixed;bottom:calc(var(--safe-bottom) + 20px);right:20px;width:52px;height:52px;border-radius:50%;background:var(--teal-600,#0E8FA0);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(14,143,160,.38);display:flex;align-items:center;justify-content:center;z-index:101;transition:transform .18s;-webkit-tap-highlight-color:transparent}
    .fab:active{transform:scale(.93)}

    /* ── BUTTONS ── */
    .btn{background:var(--green-500);color:#fff;border:none;border-radius:11px;padding:12px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 10px rgba(44,110,74,.22)}
    .btn:hover{background:var(--green-700)}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-full{width:100%;text-align:center}
    .btn-sm{padding:7px 12px;font-size:12px}
    .btn-ghost{background:var(--surface2);color:var(--text2);box-shadow:none;border:1.5px solid var(--border)}
    .btn-outline{background:transparent;color:var(--green-700);border:1.5px solid var(--green-500);box-shadow:none}
    .btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(217,79,61,.2);box-shadow:none}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
    .modal{background:var(--surface);border-radius:24px 24px 0 0;border-top:3px solid var(--teal-400,#2CBECE);width:100%;max-width:500px;padding:0 0 calc(var(--safe-bottom)+24px);animation:slideUp .25s ease}
    .modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:12px auto 0}
    .modal-head{padding:18px 22px 8px;display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-weight:800;font-size:18px;color:var(--text)}
    .modal-close{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:16px}
    .modal-body{padding:8px 22px 0}

    /* ── FORMS ── */
    input,select,textarea{background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;color:var(--text);padding:11px 13px;font-size:13px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
    input:focus,select:focus,textarea:focus{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-50)}
    input::placeholder,textarea::placeholder{color:var(--muted2)}
    .field-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;display:block}
    .form-group{display:flex;flex-direction:column;gap:10px}
    .form-row{display:flex;gap:8px}

    /* ── CHIP FILTERS ── */
    .filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
    .filter-row::-webkit-scrollbar{display:none}
    .chip{background:var(--surface);border:1.5px solid var(--border);color:var(--muted);border-radius:100px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
    .chip.active{background:var(--green-100);border-color:var(--green-200);color:var(--green-700)}

    /* ── LOG ITEMS ── */
    .log-item{background:var(--surface);border:1px solid var(--green-100);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
    .log-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .log-info{flex:1;min-width:0}
    .log-name{font-weight:600;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .log-meta{color:var(--muted);font-size:11px;margin-top:2px}
    .log-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--text);flex-shrink:0}
    .del-btn{background:none;border:none;color:var(--muted2);cursor:pointer;padding:4px;flex-shrink:0;transition:color .15s}
    .del-btn:hover{color:var(--red)}

    /* ── FOOD SELECTOR ── */
    .food-item{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
    .food-item.selected{border-color:var(--green-500);background:var(--green-50)}
    .check-circle{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .food-item.selected .check-circle{background:var(--green-700);border-color:var(--green-700)}

    /* ── SECTION ── */
    .section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:8px;padding-left:2px;margin-top:4px}

    /* ── SETTINGS SHEET ── */
    #settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s ease}
    #settings-overlay.open{opacity:1;pointer-events:all}
    #settings-sheet{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;border-top:3px solid var(--teal-400,#2CBECE);z-index:301;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94);padding-bottom:calc(var(--safe-bottom)+8px)}
    #settings-sheet.open{transform:translateY(0)}
    #settings-sheet-body{overflow-y:auto;flex:1;padding:4px 18px 16px;-webkit-overflow-scrolling:touch}
    #settings-sheet-body::-webkit-scrollbar{width:3px}
    #settings-sheet-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
    .settings-row:last-child{border-bottom:none}
    .settings-label{font-weight:600;font-size:14px;color:var(--text)}
    .settings-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .toggle{position:relative;width:46px;height:26px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:13px;transition:.3s;cursor:pointer}
    .toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
    .toggle input:checked+.toggle-slider{background:var(--green-600)}
    .toggle input:checked+.toggle-slider:before{transform:translateX(20px)}

    /* ── CHAT ── */
    .chat-bubble{padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.65;max-width:88%}
    .chat-bubble.ai{background:var(--surface);border:1px solid var(--green-100);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
    .chat-bubble.user{background:var(--green-700);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
    .chat-avatar{width:28px;height:28px;border-radius:50%;background:var(--green-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}

    /* ── TOAST ── */
    #toast{position:fixed;bottom:calc(var(--safe-bottom)+24px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:100px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;z-index:9999;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.25)}
    #toast.show{opacity:1;visibility:visible}

    /* ── SPINNER ── */
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* ── EMPTY ── */
    .empty{text-align:center;padding:30px 16px;color:var(--muted)}
    .empty-text{font-size:13px;line-height:1.6}

    /* ── ANIMATIONS ── */
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes tabFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .tab-anim{animation:tabFade .22s ease}

    /* ── RING CHART (CSS only) ── */
    .ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
    .ring-svg{transform:rotate(-90deg)}
    .ring-track{fill:none;stroke:var(--green-100)}
    .ring-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .ring-label{position:absolute;text-align:center;line-height:1.2}

    /* ── MACRO PILL (mejorado) ── */
    .macro-row{display:flex;gap:8px;margin-top:10px}
    .macro-pill{flex:1;background:var(--surface2);border-radius:12px;padding:11px 10px;text-align:center;border:1px solid var(--border);position:relative;overflow:hidden}
    .macro-pill-bg{position:absolute;bottom:0;left:0;width:100%;transition:height .7s cubic-bezier(.4,0,.2,1);opacity:.13;border-radius:0 0 12px 12px}
    .macro-name{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;position:relative;z-index:1}
    .macro-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--text);position:relative;z-index:1}
    .macro-pct{font-size:9px;color:var(--muted2);font-weight:600;margin-top:2px;position:relative;z-index:1}

    /* ── MACRO DONUT RING ── */
    .macro-donut-wrap{display:flex;align-items:center;gap:14px;padding:4px 0 8px}
    .macro-legend-row{display:flex;flex-direction:column;gap:7px;flex:1}
    .macro-legend-item{display:flex;align-items:center;gap:8px}
    .macro-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .macro-legend-label{font-size:11px;color:var(--muted);font-weight:600;flex:1}
    .macro-legend-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--text)}
    .macro-bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px;flex:1}
    .macro-bar-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}

    /* ── MEAL GROUP CARD IMPROVED ── */
    .meal-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .meal-type-badge{display:flex;align-items:center;gap:7px}
    .meal-type-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .meal-item-improved{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:7px}
    .meal-macros-mini{display:flex;gap:5px;margin-top:4px}
    .macro-tag{border-radius:100px;padding:2px 7px;font-size:9px;font-weight:700}

    /* ── CALORIE GAUGE ── */
    .kcal-gauge-wrap{margin-top:14px;position:relative}
    .kcal-gauge-arc{display:block;margin:0 auto}

    /* ── WEEK BAR CHART ── */
    .week-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
    .week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
    .week-bar-fill{width:100%;border-radius:4px 4px 0 0;transition:height .5s ease;min-height:3px}
    .week-bar-label{font-size:9px;color:var(--muted);font-weight:700}

    /* ── STREAK ── */
    .streak-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
    .streak-dot{width:10px;height:10px;border-radius:50%;background:var(--green-100)}
    .streak-dot.done{background:var(--green-500)}

    /* ── SPLASH SCREEN ── */
    #splash{
      position:fixed;inset:0;z-index:9999;
      background:linear-gradient(160deg,#0E8FA0,#0D4A5C);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:opacity .5s ease,transform .5s ease;
    }
    #splash.hide{opacity:0;transform:scale(1.04);pointer-events:none}
    .splash-logo{
      width:72px;height:72px;
      background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);
      border-radius:22px;display:flex;align-items:center;justify-content:center;
      margin-bottom:20px;
      animation:splashLogoIn .6s cubic-bezier(.34,1.56,.64,1) .15s both;
    }
    .splash-name{font-weight:800;font-size:28px;color:#fff;letter-spacing:-.5px;line-height:1;animation:splashTextIn .5s ease .35s both}
    .splash-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:8px;font-weight:600;letter-spacing:.3px;animation:splashTextIn .5s ease .45s both}
    .splash-dots{display:flex;gap:6px;margin-top:40px;animation:splashTextIn .5s ease .6s both}
    .splash-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);animation:dotPulse 1.2s ease-in-out infinite}
    .splash-dot:nth-child(2){animation-delay:.2s}
    .splash-dot:nth-child(3){animation-delay:.4s}
    @keyframes splashLogoIn{from{opacity:0;transform:scale(.7) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes splashTextIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes dotPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

    /* ── HEALTH SCORE HERO ── */
    .score-ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    .score-ring-svg{transform:rotate(-90deg)}
    .score-ring-track{fill:none;stroke:rgba(255,255,255,.18)}
    .score-ring-fill{fill:none;stroke:rgba(255,255,255,.9);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
    .score-ring-label{position:absolute;text-align:center;color:#fff;line-height:1.1}

    /* ── CONFIRM DELETE MODAL ── */
    #confirm-clear-modal{
      display:none;position:fixed;inset:0;z-index:600;
      background:rgba(0,0,0,0);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
      align-items:center;justify-content:center;padding:28px;
      transition:background .25s,backdrop-filter .25s;
    }
    #confirm-clear-modal.visible{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
    #confirm-clear-box{
      background:var(--surface);border-radius:22px;width:100%;max-width:360px;
      box-shadow:0 24px 60px rgba(0,0,0,.30);overflow:hidden;
      transform:scale(.88) translateY(16px);opacity:0;
      transition:transform .28s cubic-bezier(.34,1.4,.64,1),opacity .22s ease;
    }
    #confirm-clear-modal.visible #confirm-clear-box{transform:scale(1) translateY(0);opacity:1}

    /* ── WATER QUICK BUTTONS ── */
    .water-quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .water-btn{flex:1;min-width:60px;padding:8px 6px;border-radius:10px;border:1.5px solid var(--border2);background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent;text-align:center}

  </style>

<script>
// ═══════════════════════════════════════════════════
// ESTADO — persistencia localStorage
// ═══════════════════════════════════════════════════
const STATE_KEY = 'healthapp_v1';

function defaultState(){
  return {
    tab: 'inicio',
    dark: false,
    goals: { pasos: 10000, kcal: 2000, agua: 2500, sueno: 8, peso: 75 },
    profile: {
      nombre: '', edad: '', altura: '', pesoObjetivo: '',
      actividad: '', objetivo: '',
      // Perfil guiado (igual que en finanzas)
      answers: {}
    },
    userContext: '',
    // Logs diarios (array de {id, tipo, valor, unidad, fecha, ...extra})
    logs: [],
    // Comidas (array de {id, nombre, kcal, prot, carbs, fat, comida, fecha})
    meals: [],
    // Análisis IA cacheado
    aiAdvice: null,
    aiAdviceDate: '',
    aiLoading: false,
    // Chat messages
    chatMessages: [],
    // Perfil nutricional (wizard completado)
    nutritionProfile: [],
    nutritionWizardDone: false,
    // API key Anthropic (para llamadas IA)
    anthropicKey: '',
    // Google Fit / Health Connect
    googleFit: { connected: false, accessToken: '', lastSync: '', clientId: '', lastData: null },
    // Rutina de ejercicio
    rutinaProfile: {},
    rutinaWizardDone: false,
    rutinaPlan: null,
    rutinaPlanLoading: false,
    rutinaPlanError: '',
    _rutinaWizardOpen: true,
    dietWizardDone: false,
    dietPlan: null,
    dietPlanLoading: false,
    dietPlanError: '',
    shoppingList: [],
    shoppingListDate: '',
  };
}

let S = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(STATE_KEY));
    return saved ? { ...defaultState(), ...saved } : defaultState();
  } catch(e) { return defaultState(); }
})();

function saveState(){ localStorage.setItem(STATE_KEY, JSON.stringify(S)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n).toLocaleString('es-ES'); }
function fmtDec(n,d=1){ return Number(n).toFixed(d); }

// ═══════════════════════════════════════════════════
// HAPTIC
// ═══════════════════════════════════════════════════
function haptic(type='medium'){
  if(typeof navigator.vibrate==='function'){
    const p={light:10,medium:20,success:[10,50,10],error:[50,30,50]};
    navigator.vibrate(p[type]||20);
  }
}

// ═══════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// ═══════════════════════════════════════════════════
// DARK MODE
// ═══════════════════════════════════════════════════
function applyDark(){
  document.body.classList.toggle('dark', S.dark);
}
function toggleDark(){
  S.dark=!S.dark; applyDark(); saveState(); haptic('light');
}

// ═══════════════════════════════════════════════════
// TAB ORDER
// ═══════════════════════════════════════════════════
const TAB_ORDER = ['inicio','nutricion','asesoria','rutina'];
const SWIPE_TAB_ORDER = ['inicio','nutricion','asesoria','rutina'];

// ═══════════════════════════════════════════════════
// TAB NAVIGATION
// ═══════════════════════════════════════════════════
function updateTrackPosition(tab, animate=true){
  const track=document.getElementById('tabs-track');
  if(!track) return;
  const idx=TAB_ORDER.indexOf(tab);
  if(idx<0) return;
  track.style.transition=animate?'transform .32s cubic-bezier(.4,0,.2,1)':'none';
  track.style.transform=`translateX(-${idx*100}%)`;
  // update dots
  TAB_ORDER.forEach((_,i)=>{
    const dot=document.getElementById('dot-'+i);
    if(dot) dot.classList.toggle('active',i===idx);
  });
}

function setTab(tab){
  haptic('light');
  S.tab=tab; saveState();
  // Only re-render the newly active panel for performance
  const map={inicio:rInicio,nutricion:rNutricion,asesoria:rAsesoria,rutina:rRutina,ajustes:rAjustes};
  const panel=document.getElementById('panel-'+tab);
  if(panel){
    panel.innerHTML=(map[tab]||rInicio)();
    if(panel.firstElementChild) panel.firstElementChild.classList.add('tab-anim');
  }
  updateTrackPosition(tab, true);
  // sync bottom nav — only 4 main tabs; ajustes handled by settings-btn
  const navMap={inicio:'bnav-inicio',nutricion:'bnav-nutricion',asesoria:'bnav-asesoria',rutina:'bnav-rutina'};
  document.querySelectorAll('.tnav-item').forEach(el=>el.classList.remove('active'));
  const id=navMap[tab]; if(id){ const el=document.getElementById(id); if(el) el.classList.add('active'); }
  // Highlight settings button when on ajustes
  const settingsBtn=document.getElementById('settings-btn');
  if(settingsBtn) settingsBtn.classList.toggle('active-settings', tab==='ajustes');
  // header sub-title
  const subs={inicio:'Tu resumen diario',nutricion:'Registro de comidas',asesoria:'Asesor IA de salud',rutina:'Rutina de ejercicio',ajustes:'Configuración'};
  const sub=document.getElementById('header-sub');
  if(sub) sub.textContent=subs[tab]||'';
  bindEvents();
  drawWeekChart();
}

// ═══════════════════════════════════════════════════
// COMPUTED HELPERS
// ═══════════════════════════════════════════════════
function todayLogs(type){ return S.logs.filter(l=>l.fecha===today()&&l.tipo===type); }
function todayTotal(type){ return todayLogs(type).reduce((a,l)=>a+(parseFloat(l.valor)||0),0); }
function todayMeals(){ return S.meals.filter(m=>m.fecha===today()); }
function pct(val,goal){ return Math.min(Math.round((val/goal)*100),100); }
function last7Days(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const dayLabel=['D','L','M','X','J','V','S'][d.getDay()];
    days.push({
      date:ds, label:dayLabel,
      pasos:S.logs.filter(l=>l.fecha===ds&&l.tipo==='pasos').reduce((a,l)=>a+parseFloat(l.valor||0),0),
      kcal:S.meals.filter(m=>m.fecha===ds).reduce((a,m)=>a+parseFloat(m.kcal||0),0),
    });
  }
  return days;
}

function calcHealthScore(){
  const pasos=todayTotal('pasos');
  const agua=todayTotal('agua');
  const kcal=todayMeals().reduce((a,m)=>a+parseFloat(m.kcal||0),0);
  const sueno=todayTotal('sueno');
  let score=0;
  // Pasos: 0-30 pts
  score += Math.min(30, Math.round((pasos/S.goals.pasos)*30));
  // Agua: 0-25 pts
  score += Math.min(25, Math.round((agua/S.goals.agua)*25));
  // Kcal: 0-25 pts (mejor si está entre 70-110% del objetivo)
  if(kcal>0){
    const r=kcal/S.goals.kcal;
    score += r>=0.7&&r<=1.1 ? 25 : r>=0.5&&r<=1.3 ? 15 : 5;
  }
  // Sueño: 0-20 pts
  if(sueno>0) score += Math.min(20, Math.round((sueno/S.goals.sueno)*20));
  return Math.min(100, score);
}

function healthScoreColor(score){
  if(score>=80) return {stroke:'#4DC882',label:'Excelente',text:'var(--green-700)'};
  if(score>=60) return {stroke:'#2ABECE',label:'Bien',text:'var(--teal-500)'};
  if(score>=40) return {stroke:'#E07A2A',label:'Mejorable',text:'var(--orange)'};
  return {stroke:'#D94F3D',label:'Bajo',text:'var(--red)'};
}

function buildDietWizardCard() {
  const p = S.dietProfile || {};
  const total = DIET_QUESTIONS.length;
  const answered = DIET_QUESTIONS.filter(q => p[q.id]).length;
  const allDone = answered === total;
  const isOpen = S._dietWizardOpen !== false && answered < total;
  const progress = Math.round((answered / total) * 100);

  // ── WIZARD STEP MODE ──
  if (p._editing !== undefined) {
    const step = p._editing;
    const q = DIET_QUESTIONS[step];
    const opts = q.opts.map(opt => {
      const active = p[q.id] === opt;
      return `<button onclick="setDietAnswer('${q.id}','${opt.replace(/'/g,"\\'")}',${step})" style="width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid ${active?'var(--green-500)':'var(--border)'};background:${active?'var(--primary-bg)':'transparent'};color:${active?'var(--green-700)':'var(--text2)'};cursor:pointer;font-size:13px;font-weight:${active?'700':'500'};font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:space-between;-webkit-tap-highlight-color:transparent">
        <span>${opt}</span>
        ${active?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green-700)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
      </button>`;
    }).join('');

    return `<div class="card" style="padding:16px 18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-weight:800;font-size:13px;color:var(--text)">Perfil de dieta</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600">${answered} / ${total}</div>

function rNutricion(){
  const meals=todayMeals();
  const totalKcal=meals.reduce((a,m)=>a+parseFloat(m.kcal||0),0);
  const totalProt=meals.reduce((a,m)=>a+parseFloat(m.prot||0),0);
  const totalCarbs=meals.reduce((a,m)=>a+parseFloat(m.carbs||0),0);
  const totalFat=meals.reduce((a,m)=>a+parseFloat(m.fat||0),0);
  const gKcal=S.goals.kcal;
  const pKcalVal=pct(totalKcal,gKcal);
  const restantes=Math.max(0,gKcal-totalKcal);

  // Macro donut ring math
  const totalMacroKcal=(totalProt*4)+(totalCarbs*4)+(totalFat*9)||1;
  const protPct=Math.round((totalProt*4/totalMacroKcal)*100);
  const carbsPct=Math.round((totalCarbs*4/totalMacroKcal)*100);
  const fatPct=Math.round((totalFat*9/totalMacroKcal)*100);

  // SVG donut segments
  const R2=38; const C2=2*Math.PI*R2; const CX=46, CY=46;
  function seg(pctVal,offset,color){
    const dash=C2*(pctVal/100); const gap=C2-dash;
    return `<circle cx="${CX}" cy="${CY}" r="${R2}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="butt"
      stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}"
      stroke-dashoffset="${(-C2*(offset/100)).toFixed(1)}"
      style="transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1)"/>`;
  }
  const donutSVG=`<svg width="92" height="92" viewBox="0 0 92 92" style="transform:rotate(-90deg)">
    <circle cx="${CX}" cy="${CY}" r="${R2}" fill="none" stroke="var(--border)" stroke-width="10"/>
    ${totalKcal>0?seg(protPct,0,'#4DC882'):''}
    ${totalKcal>0?seg(carbsPct,protPct,'#E07A2A'):''}
    ${totalKcal>0?seg(fatPct,protPct+carbsPct,'#3A7FBF'):''}
  </svg>`;

  const mealGroups=['desayuno','almuerzo','cena','snack'];
  const mealConfig={
    desayuno:{label:'Desayuno',emoji:'☀️',color:'#E07A2A',bg:'var(--orange-bg)',border:'rgba(224,122,42,.2)',icon:'<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/>'},
    almuerzo:{label:'Almuerzo',emoji:'🌤️',color:'#10A8BC',bg:'var(--primary-bg)',border:'rgba(16,168,188,.2)',icon:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><line x1="7" y1="2" x2="7" y2="11"/><path d="M11 16a5 5 0 0 0-10 0v1h10v-1z"/>'},
    cena:{label:'Cena',emoji:'🌙',color:'#7B5EA7',bg:'var(--purple-bg)',border:'rgba(123,94,167,.2)',icon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'},
    snack:{label:'Snack',emoji:'🍎',color:'#4DC882',bg:'rgba(77,200,130,.1)',border:'rgba(77,200,130,.2)',icon:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/>'},
  };

  // Calorie arc (semicircular gauge)
  const arcR=52; const arcC=Math.PI*arcR; // half circle
  const arcFill=arcC*(pKcalVal/100);
  const kcalColor=pKcalVal>=100?'var(--red)':pKcalVal>=80?'var(--orange)':'rgba(255,255,255,.95)';

  return `<div>
  <!-- Perfil dieta wizard -->
  ${buildDietWizardCard()}

  <!-- Plan semanal IA -->
  ${buildDietPlanCard()}

  <!-- Lista de la compra Aldi -->
  ${buildAldiShoppingCard()}

  <!-- ── HERO CALÓRICO mejorado ── -->
  <div class="section-label" style="margin-top:4px">Registro de hoy</div>
  <div class="hero-card" style="padding:18px 20px 16px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">
      <div>
        <div class="hero-label">Calorías hoy</div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <div class="hero-value" style="font-size:40px">${fmt(totalKcal)}</div>
          <div style="font-size:13px;opacity:.65;font-weight:600">/ ${fmt(gKcal)}</div>
        </div>
        <div style="margin-top:6px;font-size:12px;opacity:.75;display:flex;align-items:center;gap:8px">
          <span>${pKcalVal}% completado</span>
          ${restantes>0?`<span style="background:rgba(255,255,255,.15);border-radius:100px;padding:2px 9px;font-weight:700">${fmt(restantes)} restantes</span>`:
            `<span style="background:rgba(217,79,61,.35);border-radius:100px;padding:2px 9px;font-weight:700">+${fmt(totalKcal-gKcal)} extra</span>`}
        </div>
      </div>
      <button onclick="document.getElementById('food-modal').style.display='block'" style="background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);border-radius:11px;padding:9px 14px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;flex-shrink:0">

        Añadir
      </button>

function buildHealthProfileCard(){
  const answers = S.profile?.answers || {};
  const total = HEALTH_QUESTIONS.length;
  const answered = Object.keys(answers).length;
  const allDone = answered === total;
  const isOpen = answered < total;

  return `<div class="card" style="padding:0;overflow:hidden">
    <div onclick="toggleHealthProfile()" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;${!isOpen?'':''}">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--green-50);border:1px solid var(--green-100);border-radius:8px;flex-shrink:0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--text)">Perfil de salud</div>
          <div style="font-size:11px;color:var(--muted);margin-top:1px">${allDone?'<span style="color:var(--green-700);font-weight:600">Perfil completo</span>':`${answered} de ${total} preguntas`}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${answered>0?`<div style="display:flex;gap:3px">${HEALTH_QUESTIONS.map(q=>`<div style="width:6px;height:6px;border-radius:50%;background:${answers[q.id]?'var(--green-500)':'var(--border2)'}"></div>`).join('')}</div>`:''}
        <svg id="profile-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .2s;transform:${isOpen?'rotate(0deg)':'rotate(-90deg)'}"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div id="health-profile-body" style="display:${isOpen?'block':'none'};padding:0 16px 16px;border-top:1px solid var(--border)">
      <div style="font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0">Responde para personalizar los consejos de la IA.</div>
      ${HEALTH_QUESTIONS.map(q=>{
        const sel=answers[q.id];
        return `<div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">
            <span style="display:flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--green-50);border:1px solid var(--green-100);border-radius:6px;flex-shrink:0">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--green-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${q.icon}</svg>
            </span>
            <span style="font-size:12px;font-weight:700;color:var(--text)">${q.label}</span>
            ${sel?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--green-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${q.options.map(opt=>`
              <button onclick="selectHealthAnswer('${q.id}','${opt.value}')" style="padding:6px 12px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid ${sel===opt.value?'var(--green-500)':'var(--border)'};background:${sel===opt.value?'var(--green-50)':'var(--surface2)'};color:${sel===opt.value?'var(--green-700)':'var(--text2)'};cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent">${opt.label}</button>
            `).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

window.selectHealthAnswer=(qId,value)=>{
  if(!S.profile) S.profile={answers:{}};
  if(!S.profile.answers) S.profile.answers={};
  S.profile.answers[qId]=value;
  haptic('light'); saveState();
  const container=document.getElementById('health-profile-body');
  if(container){
    const allDone=Object.keys(S.profile.answers).length===HEALTH_QUESTIONS.length;
    // re-render only the question chips
    container.querySelectorAll('[onclick^="selectHealthAnswer"]').forEach(btn=>{
      const [,id,val]=btn.getAttribute('onclick').match(/selectHealthAnswer\('(.+?)','(.+?)'\)/)||[];
      if(!id) return;
      const isSelected=S.profile.answers[id]===val;
      btn.style.borderColor=isSelected?'var(--green-500)':'var(--border)';
      btn.style.background=isSelected?'var(--green-50)':'var(--surface2)';
      btn.style.color=isSelected?'var(--green-700)':'var(--text2)';
    });
  }
};

window.toggleHealthProfile=()=>{
  const body=document.getElementById('health-profile-body');
  const chevron=document.getElementById('profile-chevron');
  if(!body) return;
  const open=body.style.display!=='none';
  body.style.display=open?'none':'block';
  if(chevron) chevron.style.transform=open?'rotate(-90deg)':'rotate(0deg)';
  haptic('light');
};

function rRutina(){
  const rp = S.rutinaProfile || {};
  const wizardDone = S.rutinaWizardDone;
  const currentStep = (rp._step !== undefined) ? rp._step : 0;
  const isInWizard = !wizardDone;

  return `<div>
  <!-- Hero banner -->
  <div style="background:linear-gradient(135deg,#1B5E6E 0%,#0D3A48 60%,#071820 100%);border-radius:var(--radius);padding:20px;margin-bottom:4px;position:relative;overflow:hidden">

    <div style="position:absolute;bottom:-30px;left:40px;width:90px;height:90px;border-radius:50%;background:rgba(44,190,206,.08)"></div>
    <div style="position:relative;z-index:1">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:6px">Rutina personalizada</div>
      <div style="font-size:22px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:8px">${wizardDone && S.rutinaPlan ? S.rutinaPlan.nombre || 'Mi Rutina' : 'Tu plan de entrenamiento'}</div>

  ${wizardDone ? buildRutinaPlanSection() : ''}

function buildRutinaWizard(step){
  const rp = S.rutinaProfile || {};
  const q = RUTINA_QUESTIONS[step];
  if(!q) return '';
  const total = RUTINA_QUESTIONS.length;
  const pct = Math.round(((step) / total) * 100);

  return `<div class="card" style="padding:0;overflow:hidden">
    <!-- Progress header -->
    <div style="padding:16px 18px 14px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px">Paso ${step+1} de ${total}</div>
        <div style="font-size:11px;font-weight:700;color:var(--green-700)">${pct}% completado</div>
      </div>
      <div style="background:var(--border);border-radius:4px;height:4px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--teal-500);border-radius:4px;transition:width .4s ease"></div>
      </div>
    </div>

    <!-- Pregunta -->
    <div style="padding:18px 18px 8px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px">
        <div style="width:32px;height:32px;background:var(--primary-bg);border:1px solid var(--green-100);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--green-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${q.icon}</svg>
        </div>
        <div style="font-size:15px;font-weight:800;color:var(--text);line-height:1.3">${q.label}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${q.options.map(opt => {
          const sel = rp[q.id] === opt.value;
          return `<button onclick="setRutinaAnswer('${q.id}','${opt.value}',${step})"
            style="display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;border:2px solid ${sel?'var(--teal-500)':'var(--border)'};background:${sel?'var(--primary-bg)':'var(--surface2)'};cursor:pointer;font-family:inherit;text-align:left;-webkit-tap-highlight-color:transparent;transition:all .15s;width:100%">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:700;color:${sel?'var(--green-700)':'var(--text)'}">${opt.label}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">${opt.desc}</div>
            </div>
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${sel?'var(--teal-500)':'var(--border2)'};background:${sel?'var(--teal-500)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s">

    </div>

    <div style="padding:14px 18px 18px;display:flex;gap:8px">
      ${step > 0 ? `<button onclick="rutinaWizardBack(${step})" class="btn btn-ghost btn-sm" style="flex:0 0 auto;padding:10px 16px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Atrás
      </button>` : ''}
      <div style="flex:1"></div>
      ${rp[q.id] ? `<button onclick="rutinaWizardNext(${step})" class="btn btn-sm" style="padding:10px 18px">
        ${step === RUTINA_QUESTIONS.length-1 ? 'Finalizar quiz' : 'Siguiente'}

  </div>`;

}

// ── RUTINA WIZARD ACTIONS ──
window.setRutinaAnswer = (qId, value, step) => {
  if(!S.rutinaProfile) S.rutinaProfile = {};
  S.rutinaProfile[qId] = value;
  haptic('light');
  saveState();
  // Auto-advance to next step
  setTimeout(()=>{
    rutinaWizardNext(step);
  }, 250);
};

window.rutinaWizardNext = (step) => {
  if(!S.rutinaProfile) S.rutinaProfile = {};
  const nextStep = step + 1;
  if(nextStep < RUTINA_QUESTIONS.length){
    S.rutinaProfile._step = nextStep;
  } else {
    delete S.rutinaProfile._step;
    S.rutinaWizardDone = true;
    toast('¡Perfil completado! Genera tu rutina 💪');
    haptic('success');
  }
  saveState(); render();
};

window.rutinaWizardBack = (step) => {
  if(!S.rutinaProfile) S.rutinaProfile = {};
  S.rutinaProfile._step = Math.max(0, step - 1);
  saveState(); render();
};

window.resetRutinaWizard = () => {
  S.rutinaProfile = { _step: 0 };
  S.rutinaWizardDone = false;
  S.rutinaPlan = null;
  S.rutinaPlanError = '';
  saveState(); render();
};

// ── RUTINA PLAN AI GENERATION ──
window.generateRutinaPlan = async () => {
  if(!S.anthropicKey){ toast('Configura tu API Key en Ajustes primero'); openSettingsModal(); return; }
  const rp = S.rutinaProfile || {};
  haptic('medium');
  S.rutinaPlanLoading = true;
  S.rutinaPlanError = '';
  saveState(); render();

  const lugarLabels = {gimnasio:'gimnasio con acceso a máquinas y pesas libres',casa:'casa (espacio limitado)',exterior:'exterior/parque',mixto:'gimnasio y casa combinado'};
  const objetivoLabels = {perder_grasa:'perder grasa y definir',ganar_musculo:'ganar músculo',resistencia:'mejorar resistencia cardiovascular',tonificar:'tonificar y fortalecer',bienestar:'bienestar general y salud'};
  const nivelLabels = {principiante:'principiante (menos de 3 meses)',intermedio:'intermedio (3 meses - 2 años)',avanzado:'avanzado (más de 2 años)'};
  const equipoLabels = {nada:'solo peso corporal',basico:'material básico (mancuernas, bandas, esterilla)',completo:'equipo completo (barra, discos, banco, rack)',cardio:'máquina de cardio en casa'};
  const limitLabels = {ninguna:'sin limitaciones',espalda:'problemas de espalda (evitar impacto y cargas altas)',rodilla:'problemas de rodilla/cadera (evitar saltos y sentadillas profundas)',hombro:'problemas de hombro/muñeca (evitar empuje sobre la cabeza)'};
  const prefLabels = {fuerza:'fuerza y pesas (series y repeticiones)',cardio:'cardio e intervalos (HIIT, circuitos)',funcional:'entrenamiento funcional',mixto:'combinación de estilos'};

  const profileSummary = `
- Lugar: ${lugarLabels[rp.lugar]||rp.lugar}
- Objetivo: ${objetivoLabels[rp.objetivo]||rp.objetivo}
- Nivel: ${nivelLabels[rp.nivel]||rp.nivel}
- Días/semana: ${rp.dias||3}
- Duración por sesión: ${rp.duracion||45} minutos
- Equipo disponible: ${equipoLabels[rp.equipo]||rp.equipo}
- Limitaciones físicas: ${limitLabels[rp.limitaciones]||rp.limitaciones}
- Preferencia: ${prefLabels[rp.preferencia]||rp.preferencia}`;

  const prompt = `Eres un entrenador personal experto. Diseña una rutina de ejercicio semanal personalizada basada en este perfil:

${profileSummary}

Devuelve SOLO un objeto JSON válido con esta estructura exacta (sin texto adicional, sin markdown):
{
  "nombre": "nombre motivador para la rutina",
  "descripcion": "descripción breve de la rutina (máx 15 palabras)",
  "tips": "2-3 consejos generales clave para este perfil específico",
  "dias": [
    {
      "dia": "Lunes",
      "nombre": "nombre del enfoque del día",
      "tipo": "fuerza|cardio|funcional|descanso",
      "duracion": 45,
      "calentamiento": "descripción calentamiento 5 min",
      "vuelta_calma": "descripción vuelta a la calma 5 min",
      "ejercicios": [
        {
          "nombre": "nombre del ejercicio",
          "series": 3,
          "reps": "10-12",
          "descanso": "60s",
          "nota": "consejo técnico breve o modificación si tiene limitación"
        }
      ],
      "nota": null
    }
  ]
}

Para días de descanso usa tipo "descanso", sin ejercicios, y añade nota con actividad ligera recomendada.
Adapta ESTRICTAMENTE al nivel, lugar, equipo disponible y limitaciones. Incluye ${rp.dias||3} días de entrenamiento más los de descanso necesarios para completar la semana (7 días total o solo los días de entreno si el usuario no pidió descanso específico). Para nivel principiante máximo 5-6 ejercicios por sesión, intermedio 6-8, avanzado 8-10.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'x-api-key': S.anthropicKey || ''
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    let text = data.content?.map(c => c.text || '').join('') || '';
    // Strip possible markdown fences
    text = text.replace(/```json|```/g, '').trim();
    // Extract JSON object
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('No JSON found');
    const plan = JSON.parse(jsonMatch[0]);
    plan.fecha = new Date().toLocaleDateString('es-ES', {day:'numeric',month:'long',year:'numeric'});
    S.rutinaPlan = plan;
    S.rutinaPlanLoading = false;
    S.rutinaPlanError = '';
    saveState(); render();
    toast('¡Rutina generada! 💪');
    haptic('success');
  } catch(e) {
    S.rutinaPlanLoading = false;
    S.rutinaPlanError = 'Error al generar la rutina. Verifica tu API Key y conexión.';
    saveState(); render();
  }
};

function openAddEntry(type='pasos'){
  currentEntryType=type;
  selectEntryType(type);
  document.getElementById('add-modal').style.display='block';
}

function closeAddEntry(){
  document.getElementById('add-modal').style.display='none';
}

window.selectEntryType=(type)=>{
  currentEntryType=type;
  document.querySelectorAll('#entry-type-row .chip').forEach(c=>{
    c.classList.toggle('active', c.textContent.toLowerCase().includes(
      {pasos:'pasos',agua:'agua',ejercicio:'ejercicio',peso:'peso',sueno:'sueño'}[type]||type
    ));
  });
  const fields=ENTRY_FIELDS[type]||[];
  document.getElementById('entry-fields').innerHTML=fields.map(f=>`
    <div>
      <label class="field-label">${f.label}${f.unit?` (${f.unit})`:''}</label>
      <input id="${f.id}" type="${f.type}" placeholder="${f.placeholder}" inputmode="${f.type==='number'?'decimal':'text'}"/>
    </div>`).join('');
};

window.saveEntry=()=>{
  const fields=ENTRY_FIELDS[currentEntryType]||[];
  const mainField=fields[0];
  if(!mainField){return;}
  const val=document.getElementById(mainField.id)?.value?.trim();
  if(!val){toast('Introduce un valor válido'); return;}

  haptic('success');
  const entry={id:uid(),tipo:currentEntryType,valor:parseFloat(val)||val,fecha:today()};

  if(currentEntryType==='ejercicio'){
    entry.descripcion=document.getElementById('val-ejercicio-tipo')?.value||'Ejercicio';
    entry.minutos=document.getElementById('val-ejercicio-min')?.value||0;
    entry.kcal=document.getElementById('val-ejercicio-kcal')?.value||0;
    entry.valor=entry.minutos;
  }

  S.logs.push(entry);
  saveState();
  closeAddEntry();
  toast('Registrado');
  render();
};

function buildProfileText(){
  const a=S.profile?.answers||{};
  const map={
    objetivo:{perder_peso:'objetivo perder peso',ganar_musculo:'objetivo ganar músculo',mantener:'mantener peso',resistencia:'mejorar resistencia cardiovascular',salud_general:'salud general'},
    actividad:{sedentario:'sedentario',ligero:'actividad ligera',moderado:'actividad moderada',activo:'muy activo'},
    dieta:{omnivora:'dieta omnívora',vegetariana:'dieta vegetariana',vegana:'dieta vegana',mediterranea:'dieta mediterránea',keto:'dieta cetogénica'},
    restricciones:{ninguna:'sin restricciones',lactosa:'intolerante a la lactosa',gluten:'intolerante al gluten',frutos_secos:'alérgico a frutos secos'},
    sueno_calidad:{buena:'duerme bien',regular:'sueño regular',mala:'sueño deficiente',variable:'sueño variable'},
  };
  return Object.entries(a).map(([k,v])=>map[k]?.[v]).filter(Boolean).join(', ');
}

async function generateAdvice(){
  if(!S.anthropicKey){
    toast('Configura tu API Key en Ajustes primero');
    openSettingsModal();
    return;
  }
  const btn=document.getElementById('gen-advice-btn');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Generando…'; }
  const content=document.getElementById('advice-content');
  if(content) content.innerHTML='<div style="font-size:12px;color:var(--muted);padding:8px 0">Analizando tus datos…</div>';

  const pasos=todayTotal('pasos');
  const kcal=todayMeals().reduce((a,m)=>a+parseFloat(m.kcal||0),0);
  const agua=todayTotal('agua');
  const hrLogs=S.logs.filter(l=>l.fecha===today()&&l.tipo==='frecuenciaCardiaca');
  const avgHR=hrLogs.length?hrLogs[hrLogs.length-1].valor:0;
  const distLogs=S.logs.filter(l=>l.fecha===today()&&l.tipo==='distancia');
  const distKm=distLogs.length?distLogs[distLogs.length-1].valor:0;
  const profileText=buildProfileText();
  const contextExtra=S.userContext?`\nNotas extra: ${S.userContext}`:'';

  const prompt=`Eres un asesor de salud y nutrición personal. Analiza estos datos del usuario y da 3–4 consejos concretos, prácticos y personalizados (NO genéricos). Sin emojis. Formato claro con puntos.

Datos de hoy:
- Pasos: ${fmt(pasos)} (objetivo ${fmt(S.goals.pasos)})
- Calorías consumidas: ${fmt(kcal)} kcal (objetivo ${fmt(S.goals.kcal)})
- Agua: ${agua} ml (objetivo ${S.goals.agua} ml)
${avgHR?`- Frecuencia cardíaca media: ${avgHR} bpm\n`:''}${distKm?`- Distancia recorrida: ${distKm} km\n`:''}${profileText?`Perfil: ${profileText}`:''}${contextExtra}

Sé directo, específico y accionable. Máximo 180 palabras.`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','x-api-key':S.anthropicKey||''},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const text=data.content?.map(c=>c.text||'').join('')||'No se pudo generar consejo.';
    S.aiAdvice=text;
    S.aiAdviceDate='Actualizado '+new Date().toLocaleString('es-ES',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
    saveState();
    if(content) content.innerHTML=`<div style="font-size:13px;line-height:1.85;color:var(--text2);white-space:pre-line">${text}</div><div style="font-size:10px;color:var(--muted);margin-top:10px;font-weight:600">${S.aiAdviceDate}</div>`;
  }catch(e){
    if(content) content.innerHTML='<div style="color:var(--red);font-size:12px">Error al conectar con la IA. Verifica tu conexión.</div>';
  }finally{
    if(btn){ btn.disabled=false; btn.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Generar'; }
  }
}

async function sendChat(){
  if(!S.anthropicKey){
    toast('Configura tu API Key en Ajustes primero');
    openSettingsModal();
    return;
  }
  const input=document.getElementById('chat-input');
  const text=input?.value?.trim();
  if(!text) return;

  try{

      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,system:systemPrompt,messages:[...history.slice(0,-1),{role:'user',content:text}]})

    const data=await res.json();

      chatEl.scrollTop=chatEl.scrollHeight;
    }
  }catch(e){

window.generateDietPlan = async () => {
  if(!S.anthropicKey){ toast('Configura tu API Key en Ajustes primero'); openSettingsModal(); return; }
  const dp = S.dietProfile || {};
  haptic('medium');
  S.dietPlanLoading = true;
  S.dietPlanError = '';
  saveState(); render();

  // Build profile summary
  const profileSummary = DIET_QUESTIONS.map(q => dp[q.id] ? `${q.label.replace('¿','').replace('?','')}: ${dp[q.id]}` : '').filter(Boolean).join('\n');
  const kcalMeta = S.goals?.kcal || 2000;
  const healthProfile = (S.profile?.answers ? Object.entries(S.profile.answers).map(([k,v])=>v).join(', ') : '') || '';

  const prompt = `Eres un nutricionista profesional experto en alimentación saludable y económica. El usuario tiene este perfil:

PERFIL DIETA:
${profileSummary}
Objetivo calórico diario: ${kcalMeta} kcal
${healthProfile ? `Perfil salud adicional: ${healthProfile}` : ''}

Crea un plan semanal de 7 recetas (una por día, comida principal o la que más encaje con el perfil) completamente personalizadas. Para CADA receta incluye ingredientes específicos que se puedan comprar en ALDI España.

Responde SOLO con JSON válido (sin markdown, sin texto extra):
{
  "fecha": "Plan semana ${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long'})}",
  "resumen": "frase corta describiendo el plan",
  "presupuesto_estimado": "XX-XX€/semana",
  "recetas": [
    {
      "nombre": "nombre atractivo de la receta",
      "comida": "desayuno|almuerzo|cena|merienda",
      "descripcion": "descripción apetitosa en 1-2 frases",
      "kcal": número,
      "proteinas": número,
      "carbos": número,
      "grasas": número,
      "tiempo": número_minutos,
      "pasos": ["paso 1", "paso 2", "paso 3"],
      "ingredientes_aldi": [
        {"nombre": "ingrediente", "cantidad": "cantidad con unidad", "categoria": "Frutas y verduras|Carnes y pescados|Lácteos y huevos|Cereales y legumbres|Aceites y condimentos|Congelados|Conservas|Otros", "producto_aldi": "nombre del producto tal como se vende en Aldi (ej: Pechuga de pollo Aldi Fresh 500g)"}
      ]
    }
  ]
}

IMPORTANTE: Los productos_aldi deben ser productos REALES que vende Aldi España (marcas propias como Aldi Fresh, Gut & Günstig, Favorina, etc. o marcas conocidas disponibles en Aldi). Ajusta las recetas estrictamente al perfil (restricciones, alergias, tiempo de cocina, presupuesto). Asegúrate que el JSON sea válido y completo.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','x-api-key': S.anthropicKey},
      body: JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:4000, messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    const raw = data.content?.map(c=>c.text||'').join('') || '';
    const cleaned = raw.replace(/```json|```/g,'').trim();
    const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('No se recibió un plan válido');
    const plan = JSON.parse(jsonMatch[0]);
    if(!plan.recetas?.length) throw new Error('El plan no contiene recetas');

    S.dietPlan = plan;
    S.dietPlanLoading = false;

    // Auto-generate shopping list from plan
    const allIngredients = [];
    plan.recetas.forEach(r => {
      (r.ingredientes_aldi || []).forEach(ing => {
        // Merge duplicates
        const existing = allIngredients.find(x => x.nombre.toLowerCase() === ing.nombre.toLowerCase());
        if(!existing){
          allIngredients.push({
            id: uid(),
            nombre: ing.nombre,
            cantidad: ing.cantidad,
            categoria: ing.categoria || 'Otros',
            aldiProduct: ing.producto_aldi || '',
            checked: false,
          });
        }
      });
    });

    S.shoppingList = allIngredients;
    S.shoppingListDate = new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long'});
    saveState();
    toast(`Plan generado · ${plan.recetas.length} recetas · ${allIngredients.length} productos en lista Aldi`);
    haptic('success');
    render();
  } catch(e) {
    S.dietPlanLoading = false;
    S.dietPlanError = 'Error al generar el plan: ' + (e.message||'Revisa tu API Key y conexión');
    saveState(); render();
    toast('Error al generar plan');
  }
};

// Google Fit OAuth 2.0 — PKCE implicit flow
const GFIT_SCOPES=[
  'https://www.googleapis.com/auth/fitness.activity.read',
  'https://www.googleapis.com/auth/fitness.sleep.read',
  'https://www.googleapis.com/auth/fitness.heart_rate.read',
  'https://www.googleapis.com/auth/fitness.body.read',
].join(' ');

// URL fija de GitHub Pages — Google OAuth requiere redirect_uri exacta
const GITHUB_PAGES_URL = 'https://shuken95.github.io/healthapp/';

window.connectGoogleFit=async()=>{
  const clientId=(S.googleFit?.clientId||'').trim();
  if(!clientId){toast('Introduce el Client ID en Ajustes primero'); return;}

  const redirect=encodeURIComponent(GITHUB_PAGES_URL);
  const state=Math.random().toString(36).slice(2);
  sessionStorage.setItem('gfit_state',state);
  const url=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(clientId)}&redirect_uri=${redirect}&response_type=token&scope=${encodeURIComponent(GFIT_SCOPES)}&state=${state}&prompt=consent`;
  window.location.href=url;
};

// Parse token from URL hash after OAuth redirect
(function handleOAuthCallback(){
  const hash=location.hash.slice(1);
  if(!hash.includes('access_token')) return;
  const params=Object.fromEntries(hash.split('&').map(p=>p.split('=')));
  const savedState=sessionStorage.getItem('gfit_state');
  if(params.state && params.state!==savedState){toast('Error de seguridad OAuth'); return;}
  sessionStorage.removeItem('gfit_state');
  history.replaceState(null,'',location.pathname);
  if(params.access_token){
    S.googleFit={...S.googleFit, connected:true, accessToken:params.access_token, lastSync:''};
    saveState();
    toast('Google Fit conectado');
    render();
    // Auto-sync on connect
    setTimeout(()=>syncGoogleFit(),300);
  }
})();

window.syncGoogleFit=async()=>{
  const token=S.googleFit?.accessToken;
  if(!token){toast('Google Fit no conectado'); return;}
  const btn=document.getElementById('sync-fit-btn');
  const btn2=document.getElementById('sync-fit-btn2');
  [btn,btn2].forEach(b=>{if(b){b.disabled=true; b.textContent='Sincronizando…';}});

  try{
    // Time range: today midnight → now
    const now=Date.now();
    const startMs=new Date(today()+'T00:00:00').getTime();

    const body={
      aggregateBy:[
        {dataTypeName:'com.google.step_count.delta'},
        {dataTypeName:'com.google.calories.expended'},
        {dataTypeName:'com.google.sleep.segment'},
        {dataTypeName:'com.google.heart_rate.bpm'},
        {dataTypeName:'com.google.distance.delta'},
        {dataTypeName:'com.google.weight'},
      ],
      bucketByTime:{durationMillis:86400000},
      startTimeMillis:startMs,
      endTimeMillis:now,
    };

    const res=await fetch('https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate',{
      method:'POST',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify(body),
    });

    if(res.status===401){
      S.googleFit={...S.googleFit, connected:false, accessToken:''};
      saveState(); toast('Sesión expirada — reconecta Google Fit'); render(); return;
    }

    const data=await res.json();
    let steps=0, kcalBurned=0, sleepMin=0, hrValues=[], distanceM=0, weightKg=0;

    (data.bucket||[]).forEach(bucket=>{
      (bucket.dataset||[]).forEach(ds=>{
        (ds.point||[]).forEach(pt=>{
          const dtn=ds.dataSourceId||'';
          if(dtn.includes('step_count')){
            steps+=(pt.value||[]).reduce((a,v)=>a+(v.intVal||0),0);
          } else if(dtn.includes('calories')){
            kcalBurned+=(pt.value||[]).reduce((a,v)=>a+(v.fpVal||0),0);
          } else if(dtn.includes('sleep')){
            const durMs=(parseInt(pt.endTimeNanos)-parseInt(pt.startTimeNanos))/1e6;
            sleepMin+=durMs/60000;
          } else if(dtn.includes('heart_rate')){
            (pt.value||[]).forEach(v=>{if(v.fpVal>0) hrValues.push(v.fpVal);});
          } else if(dtn.includes('distance')){
            distanceM+=(pt.value||[]).reduce((a,v)=>a+(v.fpVal||0),0);
          } else if(dtn.includes('weight')){
            const w=(pt.value||[]).find(v=>v.fpVal>0);
            if(w) weightKg=w.fpVal;
          }
        });
      });
    });

    const avgHR=hrValues.length?Math.round(hrValues.reduce((a,b)=>a+b,0)/hrValues.length):0;
    const distKm=distanceM>0?+(distanceM/1000).toFixed(2):0;

    const d=today();
    // Remove existing Fit-synced entries for today
    S.logs=S.logs.filter(l=>!(l.fecha===d&&l.fitSync));
    if(steps>0)       S.logs.push({id:uid(),tipo:'pasos',valor:Math.round(steps),fecha:d,fitSync:true});
    if(kcalBurned>50) S.logs.push({id:uid(),tipo:'kcalQuemadas',valor:Math.round(kcalBurned),fecha:d,fitSync:true});
    if(sleepMin>30)   S.logs.push({id:uid(),tipo:'sueno',valor:+(sleepMin/60).toFixed(1),fecha:d,fitSync:true});
    if(avgHR>40)      S.logs.push({id:uid(),tipo:'frecuenciaCardiaca',valor:avgHR,fecha:d,fitSync:true});
    if(distKm>0)      S.logs.push({id:uid(),tipo:'distancia',valor:distKm,fecha:d,fitSync:true});
    if(weightKg>20)   S.logs.push({id:uid(),tipo:'peso',valor:+weightKg.toFixed(1),fecha:d,fitSync:true});

    S.googleFit={...S.googleFit, lastSync:new Date().toISOString(),
      lastData:{steps:Math.round(steps),kcal:Math.round(kcalBurned),sleepMin:Math.round(sleepMin),avgHR,distKm,weightKg:+weightKg.toFixed(1)}};
    saveState();
    const parts=[
      steps?`${fmt(Math.round(steps))} pasos`:'',
      distKm?`${distKm} km`:'',
      avgHR?`FC ${avgHR} bpm`:'',
      kcalBurned>50?`${Math.round(kcalBurned)} kcal`:'',
      sleepMin>30?`${(sleepMin/60).toFixed(1)}h sueño`:'',
    ].filter(Boolean);
    toast(parts.length?`Sincronizado: ${parts.slice(0,3).join(', ')}`:'Sin datos nuevos hoy');
    render();
  }catch(e){
    toast('Error al sincronizar. Revisa tu conexión.');
  }finally{
    [btn,btn2].forEach(b=>{if(b){b.disabled=false; b.textContent='Sincronizar';}});
  }
};

// ── Draw weight history chart ───────────────────────
function drawWeightChart(){
  const canvas=document.getElementById('weight-chart');
  if(!canvas) return;
  const logs=S.logs.filter(l=>l.tipo==='peso').sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(-14);
  if(logs.length<2) return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.getBoundingClientRect().width||300;
  const H=80;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const isDark=document.body.classList.contains('dark');
  const vals=logs.map(l=>parseFloat(l.valor));
  const minV=Math.min(...vals)-1, maxV=Math.max(...vals)+1;
  const range=maxV-minV||1;
  const padL=32,padR=8,padT=8,padB=18;
  const cW=W-padL-padR,cH=H-padT-padB;
  const toX=(i)=>padL+cW*(i/(logs.length-1||1));
  const toY=(v)=>padT+cH*(1-(v-minV)/range);
  // Grid
  ctx.strokeStyle=isDark?'rgba(255,255,255,.07)':'rgba(0,0,0,.07)';
  ctx.lineWidth=1;
  [0,.5,1].forEach(f=>{
    const y=padT+cH*f;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    const v=maxV-(range*f);
    ctx.fillStyle=isDark?'rgba(216,242,247,.4)':'rgba(8,42,53,.35)';
    ctx.font='700 9px Sora,sans-serif';ctx.textAlign='right';
    ctx.fillText(v.toFixed(1),padL-4,y+3);
  });
  // Gradient fill
  const grad=ctx.createLinearGradient(0,padT,0,padT+cH);
  grad.addColorStop(0,'rgba(14,143,160,.25)');
  grad.addColorStop(1,'rgba(14,143,160,.02)');
  ctx.beginPath();
  ctx.moveTo(toX(0),toY(vals[0]));
  vals.forEach((v,i)=>{ if(i>0) ctx.lineTo(toX(i),toY(v)); });
  ctx.lineTo(toX(logs.length-1),padT+cH);
  ctx.lineTo(toX(0),padT+cH);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  // Line
  ctx.beginPath();
  vals.forEach((v,i)=>{ i===0?ctx.moveTo(toX(i),toY(v)):ctx.lineTo(toX(i),toY(v)); });
  ctx.strokeStyle='var(--teal-500)';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  // Goal line
  if(S.goals.peso){
    const gy=toY(S.goals.peso);
    if(gy>=padT&&gy<=padT+cH){
      ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(W-padR,gy);
      ctx.strokeStyle='rgba(78,200,130,.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
    }
  }
  // Dots
  vals.forEach((v,i)=>{
    ctx.beginPath();ctx.arc(toX(i),toY(v),3,0,2*Math.PI);
    ctx.fillStyle=i===vals.length-1?'var(--teal-600)':'var(--teal-400)';
    ctx.fill();
  });
}

function calcStreak(){
  let streak=0;
  const d=new Date();
  for(let i=0;i<365;i++){
    const ds=d.toISOString().slice(0,10);
    const hasPasos=S.logs.some(l=>l.fecha===ds&&l.tipo==='pasos'&&parseFloat(l.valor)>=5000);
    if(hasPasos) streak++;
    else if(i>0) break; // don't break on today if not yet registered
    d.setDate(d.getDate()-1);
  }
  return streak;
}

// ═══════════════════════════════════════════════════
// SWIPE LATERAL ENTRE PESTAÑAS
// ═══════════════════════════════════════════════════
(function initSwipe(){
  let startX=0, startY=0, startTime=0, dragging=false, currentOffset=0, lockedAxis=null;
  const THRESHOLD=40, MAX_TIME=350, ANGLE_LIMIT=30, RUBBER=0.18;

  function getIdx(){ return SWIPE_TAB_ORDER.indexOf(S.tab); }

  function onTouchStart(e){
    const t=e.touches[0];
    startX=t.clientX; startY=t.clientY; startTime=Date.now();
    dragging=true; lockedAxis=null;
    const track=document.getElementById('tabs-track');
    if(track){ track.style.transition='none'; }
    currentOffset=getIdx()*100;
  }

  function onTouchMove(e){
    if(!dragging) return;
    const t=e.touches[0];
    const dx=t.clientX-startX;
    const dy=t.clientY-startY;

    // Lock axis on first meaningful movement
    if(!lockedAxis){
      if(Math.abs(dx)<4 && Math.abs(dy)<4) return;
      lockedAxis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
    }
    if(lockedAxis==='y'){ dragging=false; return; }

    e.preventDefault();
    const track=document.getElementById('tabs-track');
    if(!track) return;
    const idx=getIdx();
    const w=window.innerWidth;
    const pct=(dx/w)*100;
    // Rubber-band at edges
    const atStart=idx===0 && dx>0;
    const atEnd=idx===TAB_ORDER.length-1 && dx<0;
    const rubber=(atStart||atEnd) ? pct*RUBBER : pct;
    track.style.transform=`translateX(calc(-${currentOffset}% + ${rubber}%))`;
  }

  function onTouchEnd(e){
    if(!dragging) return;
    dragging=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-startX;
    const elapsed=Date.now()-startTime;
    const velocity=Math.abs(dx)/elapsed; // px/ms
    const idx=getIdx();

    // Switch if: enough distance OR fast flick
    const shouldSwitch=(Math.abs(dx)>THRESHOLD || velocity>0.3) && elapsed<MAX_TIME;
    if(shouldSwitch){
      if(dx<0 && idx<SWIPE_TAB_ORDER.length-1) setTab(SWIPE_TAB_ORDER[idx+1]);
      else if(dx>0 && idx>0) setTab(SWIPE_TAB_ORDER[idx-1]);
      else updateTrackPosition(S.tab, true);
    } else {
      updateTrackPosition(S.tab, true);
    }
  }

  // Attach to viewport
  document.addEventListener('DOMContentLoaded',()=>{
    const vp=document.getElementById('tabs-viewport');
    if(!vp) return;
    vp.addEventListener('touchstart',onTouchStart,{passive:true});
    vp.addEventListener('touchmove',onTouchMove,{passive:false});
    vp.addEventListener('touchend',onTouchEnd,{passive:true});
  });
  // Also run immediately if already loaded
  const vp=document.getElementById('tabs-viewport');
  if(vp){
    vp.addEventListener('touchstart',onTouchStart,{passive:true});
    vp.addEventListener('touchmove',onTouchMove,{passive:false});
    vp.addEventListener('touchend',onTouchEnd,{passive:true});
  }
})();
