// GOOGLE HEALTH CONNECT API — mejorado
// ═══════════════════════════════════════════════════
// ═══════════════════════════════════════════════════
// HEALTH CONNECT — Capacitor Plugin
// @capacitor-community/health-connect
// ═══════════════════════════════════════════════════

// El plugin se carga desde el bridge de Capacitor
const HC = () => window?.Capacitor?.Plugins?.HealthConnect;
const isCapacitor = () => !!window?.Capacitor?.isNativePlatform?.();

// Métricas a leer con sus tipos Health Connect
const HC_RECORD_TYPES = [
  'Steps',
  'HeartRate',
  'TotalCaloriesBurned',
  'SleepSession',
  'Distance',
  'Weight',
  'OxygenSaturation',
  'Speed',
];

// Solicitar permisos de lectura
window.requestHealthPermissions = async () => {
  const hc = HC();
  if (!hc) throw new Error('Health Connect no disponible');
  const permissions = HC_RECORD_TYPES.map(t => ({ accessType: 'read', recordType: t }));
  const result = await hc.requestHealthPermissions({ permissions });
  return result.grantedPermissions || [];
};

// Comprobar permisos ya concedidos
window.checkHealthPermissions = async () => {
  const hc = HC();
  if (!hc) return [];
  const permissions = HC_RECORD_TYPES.map(t => ({ accessType: 'read', recordType: t }));
  const result = await hc.checkHealthPermissions({ permissions });
  return result.grantedPermissions || [];
};

// Sincronización principal — lee hoy de Health Connect
window.syncHealthConnect = async () => {
  if (!isCapacitor()) {
    toast('Esta función requiere la app instalada en Android');
    return;
  }
  const hc = HC();
  if (!hc) { toast('Health Connect no disponible en este dispositivo'); return; }

  // Mostrar estado en botones
  ['hc-sync-btn','hc-sync-btn2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.disabled = true; el.textContent = 'Sincronizando…'; }
  });

  try {
    // Pedir permisos si no están concedidos
    const granted = await window.requestHealthPermissions();
    if (!granted.length) {
      toast('Sin permisos de Health Connect'); return;
    }

    const now   = new Date();
    const start = new Date(now.toDateString()); // medianoche de hoy
    const startISO = start.toISOString();
    const endISO   = now.toISOString();

    // ── Pasos ──
    let steps = 0;
    try {
      const r = await hc.readRecords({ recordType:'Steps', startTime:startISO, endTime:endISO });
      steps = (r.records||[]).reduce((s,rec)=>s+(rec.count||0),0);
    } catch(_) {}

    // ── Frecuencia cardíaca ──
    let avgHR = 0;
    try {
      const r = await hc.readRecords({ recordType:'HeartRate', startTime:startISO, endTime:endISO });
      const samples = (r.records||[]).flatMap(rec=>rec.samples||[]).map(s=>s.beatsPerMinute).filter(v=>v>0);
      if (samples.length) avgHR = Math.round(samples.reduce((a,b)=>a+b,0)/samples.length);
    } catch(_) {}

    // ── Calorías ──
    let kcal = 0;
    try {
      const r = await hc.readRecords({ recordType:'TotalCaloriesBurned', startTime:startISO, endTime:endISO });
      kcal = (r.records||[]).reduce((s,rec)=>s+(rec.energy?.inKilocalories||0),0);
    } catch(_) {}

    // ── Sueño ──
    let sleepMin = 0;
    try {
      const r = await hc.readRecords({ recordType:'SleepSession', startTime:startISO, endTime:endISO });
      (r.records||[]).forEach(rec => {
        const ms = new Date(rec.endTime) - new Date(rec.startTime);
        sleepMin += ms / 60000;
      });
    } catch(_) {}

    // ── Distancia ──
    let distKm = 0;
    try {
      const r = await hc.readRecords({ recordType:'Distance', startTime:startISO, endTime:endISO });
      const meters = (r.records||[]).reduce((s,rec)=>s+(rec.distance?.inMeters||0),0);
      distKm = +(meters/1000).toFixed(2);
    } catch(_) {}

    // ── Peso ──
    let weightKg = 0;
    try {
      const r = await hc.readRecords({ recordType:'Weight', startTime:startISO, endTime:endISO });
      const last = (r.records||[]).at(-1);
      if (last) weightKg = +(last.weight?.inKilograms||0).toFixed(1);
    } catch(_) {}

    // ── SpO2 ──
    let spo2 = 0;
    try {
      const r = await hc.readRecords({ recordType:'OxygenSaturation', startTime:startISO, endTime:endISO });
      const vals = (r.records||[]).map(rec=>rec.percentage||0).filter(v=>v>0);
      if (vals.length) spo2 = +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    } catch(_) {}

    // ── Guardar en S.logs ──
    const d = today();
    S.logs = S.logs.filter(l => !(l.fecha===d && l.fitSync));
    if (steps > 0)      S.logs.push({id:uid(),tipo:'pasos',          valor:Math.round(steps),          fecha:d, fitSync:true});
    if (avgHR > 40)     S.logs.push({id:uid(),tipo:'frecuenciaCardiaca',valor:avgHR,                   fecha:d, fitSync:true});
    if (kcal > 50)      S.logs.push({id:uid(),tipo:'kcalQuemadas',    valor:Math.round(kcal),           fecha:d, fitSync:true});
    if (sleepMin > 30)  S.logs.push({id:uid(),tipo:'sueno',           valor:+(sleepMin/60).toFixed(1),  fecha:d, fitSync:true});
    if (distKm > 0)     S.logs.push({id:uid(),tipo:'distancia',       valor:distKm,                     fecha:d, fitSync:true});
    if (weightKg > 20)  S.logs.push({id:uid(),tipo:'peso',            valor:weightKg,                   fecha:d, fitSync:true});
    if (spo2 > 0)       S.logs.push({id:uid(),tipo:'spo2',            valor:spo2,                       fecha:d, fitSync:true});

    S.googleFit = {
      ...S.googleFit,
      connected: true,
      lastSync: new Date().toISOString(),
      lastData: { steps:Math.round(steps), kcal:Math.round(kcal), sleepMin:Math.round(sleepMin), avgHR, distKm, weightKg, spo2 }
    };
    saveState();

    const parts = [
      steps       ? `${Math.round(steps).toLocaleString('es-ES')} pasos` : '',
      avgHR       ? `FC ${avgHR} bpm`          : '',
      distKm      ? `${distKm} km`              : '',
      kcal > 50   ? `${Math.round(kcal)} kcal` : '',
      sleepMin>30 ? `${(sleepMin/60).toFixed(1)}h sueño` : '',
      spo2        ? `SpO2 ${spo2}%`             : '',
    ].filter(Boolean);

    toast(parts.length ? `✓ ${parts.slice(0,3).join(' · ')}` : 'Sin datos nuevos hoy');
    render();

  } catch(e) {
    console.error('Health Connect error:', e);
    toast('Error al leer Health Connect: ' + (e.message||e));
  } finally {
    ['hc-sync-btn','hc-sync-btn2'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.disabled = false; el.textContent = 'Sincronizar ahora'; }
    });
  }
};
